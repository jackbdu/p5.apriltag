<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>p5.apriltag sample tags</title>
    <style>
      .tags {
        display: grid;
        gap: 2rem;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      figure { margin: 0; text-align: center; }
      img { image-rendering: pixelated; width: 220px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Multi-family AprilTag samples</h1>
      <p>
        Display or print these official ID-0 markers, then point the basic
        example's camera at them.
      </p>
      <div class="tags">
        <figure>
          <img src="../assets/apriltag-imgs/tag36_11_00000.png" alt="tag36h11 ID 0" />
          <figcaption>tag36h11</figcaption>
        </figure>
        <figure>
          <img src="../assets/apriltag-imgs/tag41_12_00000.png" alt="tagStandard41h12 ID 0" />
          <figcaption>tagStandard41h12</figcaption>
        </figure>
        <figure>
          <img src="../assets/apriltag-imgs/tag52_13_00000.png" alt="tagStandard52h13 ID 0" />
          <figcaption>tagStandard52h13</figcaption>
        </figure>
        <figure>
          <img src="../assets/apriltag-imgs/tag21_07_00000.png" alt="tagCircle21h7 ID 0" />
          <figcaption>tagCircle21h7</figcaption>
        </figure>
        <figure>
          <img src="../assets/apriltag-imgs/tag49_12_00000.png" alt="tagCircle49h12 ID 0" />
          <figcaption>tagCircle49h12</figcaption>
        </figure>
        <figure>
          <img src="../assets/apriltag-imgs/tag48_12_00000.png" alt="tagCustom48h12 ID 0" />
          <figcaption>tagCustom48h12</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
